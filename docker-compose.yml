services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - MOD_KEY=${MOD_KEY}
      - DATA_DIR=/data
      - TZ=${TZ:-Europe/Zurich}
    volumes:
      - ./data:/data
    ports:
      # Nur auf localhost – zum Debuggen per curl auf dem Server.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
