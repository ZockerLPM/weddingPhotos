# Nur noch die Anwendung. Der Reverse Proxy liegt in einem eigenen Stack
# unter /opt/proxy und erreicht diesen Container über das gemeinsame Netz
# "web" unter dem Alias "fotos".
services:
  app:
    build: .
    restart: unless-stopped
    # Ohne Begrenzung wächst das Docker-Log unbegrenzt und kann irgendwann
    # die Platte füllen.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      - MOD_KEY=${MOD_KEY}
      - DATA_DIR=/data
      - TZ=${TZ:-Europe/Zurich}
    volumes:
      - ./data:/data
    ports:
      # Nur auf localhost – zum Debuggen per curl auf dem Server.
      - "127.0.0.1:3000:3000"
    networks:
      # Bleibt für spätere Services dieses Projekts erhalten.
      default: {}
      # Der Proxy spricht diesen Container als "fotos" an. Der Servicename
      # "app" wäre auf einem von mehreren Projekten geteilten Netz zu
      # generisch und würde früher oder später kollidieren.
      web:
        aliases: [fotos]
    # ffmpeg-Konvertierungen ziehen minutenlang volle Last. Die Begrenzung
    # lässt auf den 2 vCPU genug übrig, damit die anderen Dienste auf dem
    # Server währenddessen ansprechbar bleiben.
    cpus: 1.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  web:
    external: true
