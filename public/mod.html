<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Moderation</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="page wide">
  <header>
    <h1>🛡️ Moderation</h1>
    <p class="sub">Foto antippen = von Fotowand &amp; Galerie ausblenden. Nochmal antippen = wieder zeigen.</p>
  </header>

  <div class="chips" id="chips"></div>

  <div class="modbar">
    <button class="btn" id="btnPause">⏸ Pause</button>
    <button class="btn" id="btnSkip">⏭ Überspringen</button>
    <button class="btn" id="btnQuiet">🤫 Ruhe-Modus</button>
    <button class="btn" id="btnGallery">🔒 Galerie</button>
    <button class="btn danger" id="btnReload">🔄 Fotowand neu laden</button>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script src="/js/mod.js"></script>
</body>
</html>
