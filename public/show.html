<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Fotowand</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: #0b0d10; color: #f0ede6;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden; cursor: none;
    }
    #stage { position: fixed; inset: 0; }

    .layer {
      position: absolute; inset: 0;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .layer.active { opacity: 1; }

    /* Unscharfer Hintergrund aus demselben Bild – füllt bei Hochformat
       die schwarzen Balken. */
    .layer .bg {
      position: absolute; inset: -6%;
      background-position: center;
      background-size: cover;
      filter: blur(45px) brightness(.45) saturate(1.15);
    }
    .layer img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      will-change: transform, opacity;
    }

    #badge {
      position: fixed; left: 50%; bottom: 6vh;
      transform: translateX(-50%) translateY(20px);
      background: rgba(15, 17, 21, .82);
      border: 1px solid rgba(212, 175, 106, .5);
      border-radius: 999px;
      padding: 12px 28px;
      font-size: clamp(16px, 2.4vh, 26px);
      opacity: 0;
      transition: opacity .5s ease, transform .5s ease;
      white-space: nowrap; max-width: 90vw;
      overflow: hidden; text-overflow: ellipsis;
    }
    #badge.on { opacity: 1; transform: translateX(-50%) translateY(0); }
    #badge b { color: #d4af6a; }
    #badge .cap { color: #b9bec7; }

    #credit {
      position: fixed; left: 2vw; bottom: 2vh;
      color: rgba(240, 237, 230, .55);
      font-size: clamp(12px, 1.6vh, 18px);
      text-shadow: 0 1px 3px #000;
      transition: opacity .5s;
    }

    #counter {
      position: fixed; right: 2vw; bottom: 2vh;
      color: rgba(240, 237, 230, .55);
      font-size: clamp(12px, 1.6vh, 18px);
      text-shadow: 0 1px 3px #000;
    }

    #pausedIcon {
      position: fixed; top: 2vh; right: 2vw;
      font-size: clamp(18px, 3vh, 30px);
      opacity: 0; transition: opacity .4s;
    }
    #pausedIcon.on { opacity: .7; }

    #offlineIcon {
      position: fixed; top: 2vh; left: 2vw;
      font-size: clamp(14px, 2vh, 22px);
      opacity: 0; transition: opacity .4s;
      color: #e2b25f;
    }
    #offlineIcon.on { opacity: .8; }

    #waiting {
      position: fixed; inset: 0;
      display: none;
      flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; gap: 2vh;
      padding: 4vw;
    }
    #waiting.on { display: flex; }
    #waiting .big { font-size: clamp(28px, 6vh, 64px); }
    #waiting .url {
      color: #d4af6a;
      font-size: clamp(22px, 5vh, 56px);
      font-weight: 600;
    }
    #waiting .sub { color: #9aa0aa; font-size: clamp(14px, 2.4vh, 24px); }

    /* Namentliche Begrüssung beim ersten Beitrag eines Gastes */
    #badge.greeting {
      background: rgba(212, 175, 106, .95);
      border-color: #f0d9a8;
      color: #201a10;
      font-size: clamp(20px, 3.4vh, 38px);
      padding: 16px 40px;
    }
    #badge.greeting b { color: #201a10; }

    /* Rückblick: Uhrzeit-Marke oben */
    #clock {
      position: fixed; top: 3vh; left: 50%;
      transform: translateX(-50%);
      color: rgba(240, 237, 230, .8);
      font-size: clamp(16px, 2.6vh, 30px);
      letter-spacing: .12em;
      text-shadow: 0 1px 6px #000;
      opacity: 0; transition: opacity .5s;
    }
    #clock.on { opacity: 1; }

    /* Vollflächige Karte für Titel, Auszeichnungen und Abschluss */
    #card {
      position: fixed; inset: 0;
      background: radial-gradient(circle at 50% 40%, #1d2026 0%, #0b0d10 75%);
      display: flex;
      flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; gap: 1.6vh; padding: 5vw;
      /* visibility statt display, damit die Überblendung wirklich läuft */
      visibility: hidden; opacity: 0;
      transition: opacity .8s ease, visibility 0s linear .8s;
      z-index: 20;
    }
    #card.on {
      visibility: visible; opacity: 1;
      transition: opacity .8s ease, visibility 0s;
    }
    #card .icon { font-size: clamp(46px, 11vh, 130px); line-height: 1; }
    #card .title {
      font-size: clamp(22px, 4.4vh, 54px);
      color: #d4af6a; letter-spacing: .02em;
    }
    #card .who { font-size: clamp(30px, 7vh, 84px); font-weight: 600; }
    #card .detail { color: #9aa0aa; font-size: clamp(15px, 2.6vh, 30px); }
  </style>
</head>
<body>
<div id="stage">
  <div class="layer" id="layerA"><div class="bg"></div><img alt=""></div>
  <div class="layer" id="layerB"><div class="bg"></div><img alt=""></div>
</div>

<div id="badge"></div>
<div id="clock"></div>
<div id="credit"></div>

<div id="card">
  <div class="icon" id="cardIcon"></div>
  <div class="title" id="cardTitle"></div>
  <div class="who" id="cardWho"></div>
  <div class="detail" id="cardDetail"></div>
</div>
<div id="counter"></div>
<div id="pausedIcon">⏸</div>
<div id="offlineIcon">📡</div>

<div id="waiting">
  <div class="big">📷 Die Fotowand wartet auf euch!</div>
  <div class="sub">Fotos hochladen unter</div>
  <div class="url" id="waitUrl"></div>
  <div class="sub">… und Sekunden später erscheinen sie hier.</div>
</div>

<script src="/js/challenges.js"></script>
<script src="/js/show.js"></script>
</body>
</html>
